<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" aria-label="Cambiar a modo claro" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="toast" class="hidden"></div>
      </div>

      <aside class="panel">
        <div class="stats-row">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="pieces-row">
          <div class="panel-section" id="hold-section">
            <span class="label">HOLD</span>
            <canvas id="hold-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="hidden">
          <input id="player-name-input" type="text" maxlength="20" placeholder="Tu nombre" autocomplete="off" />
          <button type="submit" class="btn-primary">Jugar</button>
        </form>

        <div id="ranking-list" class="hidden"></div>

        <button id="restart-btn" class="btn-primary hidden">Reiniciar</button>

        <div id="pause-menu" class="hidden">
          <button id="resume-btn" class="btn-primary">Reanudar</button>

          <div class="pause-level-row">
            <label for="start-level-select">Nivel inicial</label>
            <select id="start-level-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>

          <button id="pause-controls-toggle" type="button">Ver controles</button>
          <ul id="pause-controls-list" class="hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
